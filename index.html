<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ночь в музее</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section class="event-card">
            <h1 id="event-title">Ночь в музее</h1>
            <p>15 ноября, 18:30</p>
            <p>Музей космонавтики, проспект Мира, 111</p>
            <p>Вечерняя программа с выставкой и экскурсиями</p>
            <button id="show-program" type="button">Показать программу</button>
            <div id="program" hidden></div>
        </section>
        <form id="service-form" class="service-form" hidden>
            <h2>Выберите услуги</h2>
            <p>
                <input type="checkbox" id="guide">
                <label for="guide">Экскурсия с гидом</label>
            </p>
            <p>
                <input type="checkbox" id="audio">
                <label for="audio">Аудиогид</label>
            </p>

            <p>
                <input type="checkbox" id="catalog">
                <label for="catalog">Каталог выставки</label>
            </p>
            <button type="submit">Рассчитать стоимость</button>
        </form>
        <p id="choice-error" hidden></p>
        <p id="data-error" hidden></p>
        <div id="result" hidden></div>
        <pre id="report-json" hidden></pre>
    </main>
    <script src="app.js"></script>
</body>

</html>
